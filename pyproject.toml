[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-briar"
version = "0.1.0"
description = "Experimental Hermes Agent Briar platform plugin"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
