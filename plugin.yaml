name: briar-platform
label: Briar
kind: platform
version: 1.0.0
description: >
  Briar gateway adapter for Hermes Agent.
  Experimental. Requires a Briar-side transport bridge.
author: John Wyles
requires_env:
  - name: BRIAR_CONTACT_ID
    description: "Briar contact ID to send messages to/from"
    prompt: "Briar contact ID"
    password: false
  - name: BRIAR_API_URL
    description: "URL of the Briar local API bridge (e.g. http://127.0.0.1:7000)"
    prompt: "Briar API bridge URL"
    password: false
optional_env:
  - name: BRIAR_HOME_CHANNEL
    description: "Contact ID for cron delivery / home chat"
    prompt: "Home contact ID"
    password: false
  - name: BRIAR_ALLOWED_USERS
    description: "Comma-separated contact IDs allowed to talk to the agent"
    prompt: "Allowed contact IDs"
    password: false
